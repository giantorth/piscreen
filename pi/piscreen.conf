# /etc/piscreen.conf - PiScreen receiver settings.
# key = value, same names as the command-line options (see: piscreen_receiver.py --help).
# Restart after editing:  sudo systemctl restart piscreen

port = 8090

# Display size is detected from DRM (or the framebuffer). SimHub renders at exactly this size.
# width = 800
# height = 480

# Output: auto picks kms when /dev/dri exists, else fbdev.
# sink = auto
# kms_driver = vc4
# fbdev = /dev/fb0

# Decoder: auto prefers the hardware v4l2h264dec.
# decoder = auto

# Jitter buffer in ms. Raise it (50-100) if the picture stutters on weak WiFi.
# latency = 20

# Touch: auto picks the first touchscreen. Fix orientation/calibration here if taps land wrong.
# touch_device = auto
# touch_swap_xy = false
# touch_invert_x = false
# touch_invert_y = false
# touch_calibration = 200,3900,200,3900

# Turn the backlight off while SimHub isn't rendering to this screen.
# idle_backlight_off = true
